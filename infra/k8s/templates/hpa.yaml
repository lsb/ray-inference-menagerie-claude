apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{MODEL_NAME}}-ray-worker-hpa
  namespace: {{TARGET_NS}}
  labels:
    app: {{APP_LABEL}}
    component: ray-worker
    model: {{MODEL_NAME}}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{MODEL_NAME}}-ray-worker
  minReplicas: 0
  maxReplicas: 10
  metrics:
  - type: Pods
    pods:
      metric:
        name: ray_actor_queue_size
        selector:
          matchLabels:
            actor_name: {{MODEL_NAME}}
      target:
        type: AverageValue
        averageValue: "1"
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 25
        periodSeconds: 60