apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{MODEL_NAME}}-sa
  namespace: {{TARGET_NS}}
  labels:
    app: {{APP_LABEL}}
    model: {{MODEL_NAME}}
  annotations:
    # GCP Workload Identity binding
    iam.gke.io/gcp-service-account: {{MODEL_NAME}}@{{GCP_PROJECT_ID}}.iam.gserviceaccount.com
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{MODEL_NAME}}-role
  namespace: {{TARGET_NS}}
  labels:
    app: {{APP_LABEL}}
    model: {{MODEL_NAME}}
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list", "watch", "create"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["*"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{MODEL_NAME}}-binding
  namespace: {{TARGET_NS}}
  labels:
    app: {{APP_LABEL}}
    model: {{MODEL_NAME}}
subjects:
- kind: ServiceAccount
  name: {{MODEL_NAME}}-sa
  namespace: {{TARGET_NS}}
roleRef:
  kind: Role
  name: {{MODEL_NAME}}-role
  apiGroup: rbac.authorization.k8s.io